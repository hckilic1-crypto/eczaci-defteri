<title id="title">Minoksidil ve finasteridin iki farklı etki yolu</title><desc id="desc">Minoksidilin folikülde aktif metabolite dönüşümü ve büyüme sinyalleri; finasteridin 5-alfa redüktazı baskılayarak DHT oluşumunu azaltması.</desc>
