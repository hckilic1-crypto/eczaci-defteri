<text x="50" y="362" font-size="13" font-family="Arial,sans-serif" fill="#667a69">Bu hedefler farklı klinik kanıt düzeylerindedir; tedavi seçimi dermatolojik değerlendirmeye dayanır.</text><text x="30" y="409" font-size="11" fill="#678571" font-family="Arial,sans-serif">Şematik çizim. Tedavi sonucu, klinik tanı veya ölçülmüş kişisel koruma değildir.</text></svg>