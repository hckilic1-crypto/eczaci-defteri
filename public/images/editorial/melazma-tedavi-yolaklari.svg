<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="t d"><title id="t">Melazma tedavisinde farklı hedefler</title><desc id="d">Fotokoruma, tirozinaz ilişkili melanin sentezi ve melanozom aktarımı ile topikal tedavilerin temel hedefleri.</desc><rect width="1080" height="430" fill="#f7f5ed"/><path d="M30 70 H1050 M30 382 H1050" stroke="#b7cbb9"/><text x="30" y="42" font-size="26" fill="#173c2a" font-family="Georgia,serif">Melazma tedavisinde farklı hedefler</text><text x="1048" y="42" text-anchor="end" fill="#678571" font-size="10" font-family="Arial,sans-serif">ECZACI DEFTERİ / BİLİMSEL ŞEMA</text>
<g fill="#e5ebdf" stroke="#afc8b3"><rect x="45" y="130" width="284" height="128"/><rect x="394" y="130" width="284" height="128"/><rect x="743" y="130" width="284" height="128"/></g>
