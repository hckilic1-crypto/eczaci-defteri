<text x="50" y="350" font-size="15" font-family="Arial,sans-serif" fill="#526b59">Etiket değeri yeterli miktar ve standart test koşulları içindir. Dışarıda düzenli yenileme gerekir.</text><text x="30" y="409" font-size="11" fill="#678571" font-family="Arial,sans-serif">Şematik çizim. Tedavi sonucu, klinik tanı veya ölçülmüş kişisel koruma değildir.</text></svg>